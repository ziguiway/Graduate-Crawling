<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
  <rect width="940" height="360" fill="#fffdf8"/>
  <text x="35" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">把矩阵方程转化为优化问题</text>
  <rect x="35" y="100" width="170" height="90" rx="8" fill="#e7f1fb" stroke="#1261a0" stroke-width="2"/>
  <text x="91" y="137" font-family="Arial, sans-serif" font-size="23" fill="#17202a">英文向量</text>
  <text x="96" y="168" font-family="Arial, sans-serif" font-size="20" fill="#1261a0">X</text>
  <line x1="205" y1="145" x2="255" y2="145" stroke="#495057" stroke-width="3"/>
  <polygon points="255,145 240,137 240,153" fill="#495057"/>
  <rect x="255" y="100" width="170" height="90" rx="8" fill="#fff0d9" stroke="#f08c46" stroke-width="2"/>
  <text x="312" y="137" font-family="Arial, sans-serif" font-size="23" fill="#17202a">变换矩阵</text>
  <text x="334" y="168" font-family="Arial, sans-serif" font-size="20" fill="#f08c46">R</text>
  <line x1="425" y1="145" x2="475" y2="145" stroke="#495057" stroke-width="3"/>
  <polygon points="475,145 460,137 460,153" fill="#495057"/>
  <rect x="475" y="100" width="170" height="90" rx="8" fill="#e8f5ed" stroke="#16794f" stroke-width="2"/>
  <text x="522" y="137" font-family="Arial, sans-serif" font-size="23" fill="#17202a">预测法文空间</text>
  <text x="545" y="168" font-family="Arial, sans-serif" font-size="20" fill="#16794f">X R</text>
  <line x1="645" y1="145" x2="695" y2="145" stroke="#495057" stroke-width="3"/>
  <polygon points="695,145 680,137 680,153" fill="#495057"/>
  <rect x="695" y="100" width="190" height="90" rx="8" fill="#f7e8ee" stroke="#b02a37" stroke-width="2"/>
  <text x="752" y="137" font-family="Arial, sans-serif" font-size="23" fill="#17202a">真实法文空间</text>
  <text x="780" y="168" font-family="Arial, sans-serif" font-size="20" fill="#b02a37">Y</text>
  <line x1="170" y1="270" x2="770" y2="270" stroke="#adb5bd" stroke-width="2"/>
  <text x="190" y="238" font-family="Arial, sans-serif" font-size="20" fill="#17202a">目标：让 X R 尽量接近 Y</text>
  <text x="190" y="315" font-family="Arial, sans-serif" font-size="20" fill="#495057">损失：||X R - Y||²</text>
  <text x="535" y="315" font-family="Arial, sans-serif" font-size="20" fill="#495057">梯度下降：R ← R - 学习率 × 梯度</text>
</svg>
