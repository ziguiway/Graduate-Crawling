<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470">
  <rect width="840" height="470" fill="#fffdf8"/>
  <text x="35" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Multiple planes make a bucket ID</text>
  <line x1="65" y1="375" x2="350" y2="95" stroke="#d94841" stroke-width="3"/>
  <line x1="70" y1="120" x2="355" y2="390" stroke="#1261a0" stroke-width="3"/>
  <line x1="90" y1="260" x2="365" y2="260" stroke="#16794f" stroke-width="3"/>
  <circle cx="235" cy="185" r="8" fill="#f08c46"/>
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="18" fill="#17202a">query q</text>
  <text x="88" y="418" font-family="Arial, sans-serif" font-size="17" fill="#495057">Each plane asks: which side is q on?</text>
  <line x1="440" y1="92" x2="440" y2="394" stroke="#adb5bd" stroke-width="2"/>
  <text x="485" y="112" font-family="Arial, sans-serif" font-size="20" fill="#17202a">Plane result</text>
  <text x="485" y="160" font-family="Arial, sans-serif" font-size="20" fill="#d94841">P1  -&gt;  1</text>
  <text x="485" y="205" font-family="Arial, sans-serif" font-size="20" fill="#1261a0">P2  -&gt;  0</text>
  <text x="485" y="250" font-family="Arial, sans-serif" font-size="20" fill="#16794f">P3  -&gt;  1</text>
  <line x1="480" y1="280" x2="760" y2="280" stroke="#495057" stroke-width="2"/>
  <text x="485" y="325" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17202a">bits = 101</text>
  <text x="485" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17202a">bucket = 1 + 0 + 4 = 5</text>
  <text x="485" y="415" font-family="Arial, sans-serif" font-size="18" fill="#495057">q goes to bucket #5</text>
</svg>
