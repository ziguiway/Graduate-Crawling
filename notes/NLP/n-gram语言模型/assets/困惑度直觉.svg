<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-labelledby="title desc">
  <title id="title">困惑度的直觉</title>
  <desc id="desc">比较模型对自然搭配和陌生搭配的预测概率以及对应的困惑度高低。</desc>
  <rect width="920" height="370" fill="#f8fbf8"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#173c2b">困惑度：模型对一句话有多陌生</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="55" y="88" width="355" height="210" rx="10" fill="#e5f1e8" stroke="#36684d" stroke-width="2"/>
    <text x="232" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#173c2b">训练中常见的搭配</text>
    <text x="232" y="175" text-anchor="middle" font-size="22" fill="#173c2b">I eat scrambled eggs</text>
    <text x="232" y="220" text-anchor="middle" font-size="18" fill="#31513f">每一步预测概率较高</text>
    <text x="232" y="260" text-anchor="middle" font-size="23" font-weight="700" fill="#173c2b">困惑度低</text>
    <rect x="510" y="88" width="355" height="210" rx="10" fill="#f8e9e8" stroke="#9a4c48" stroke-width="2"/>
    <text x="687" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#642724">训练中罕见的搭配</text>
    <text x="687" y="175" text-anchor="middle" font-size="22" fill="#642724">I eat scrambled keyboard</text>
    <text x="687" y="220" text-anchor="middle" font-size="18" fill="#713b38">某些步骤预测概率很低</text>
    <text x="687" y="260" text-anchor="middle" font-size="23" font-weight="700" fill="#642724">困惑度高</text>
  </g>
  <text x="460" y="340" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#31513f">它衡量的是模型的预测意外程度，不是直接判断句子在现实世界是否正确。</text>
</svg>
