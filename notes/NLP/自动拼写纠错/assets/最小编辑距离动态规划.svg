<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" role="img" aria-labelledby="title desc">
  <title id="title">最小编辑距离动态规划矩阵</title>
  <desc id="desc">play 转换为 stay 的编辑距离矩阵，右下角为最小编辑距离 4。</desc>
  <style>
    .text{font:18px sans-serif;fill:#17212b}
    .head{font:700 22px sans-serif;fill:#17212b}
    .cell{stroke:#61707d;stroke-width:1;fill:#fff}
    .axis{font:700 20px sans-serif;fill:#34404a}
    .note{font:16px sans-serif;fill:#46515c}
  </style>
  <rect width="820" height="570" fill="#fbfaf7"/>
  <text x="410" y="42" text-anchor="middle" class="head">D[i,j]：source = play，target = stay</text>
  <text x="430" y="82" text-anchor="middle" class="note">每个格子取：删除、插入、替换/匹配 三种代价的最小值</text>
  <text x="210" y="145" text-anchor="middle" class="axis">target</text>
  <text x="83" y="295" text-anchor="middle" class="axis" transform="rotate(-90 83 295)">source</text>
  <g transform="translate(180 165)">
    <text x="55" y="-18" class="axis">#</text><text x="135" y="-18" class="axis">s</text><text x="215" y="-18" class="axis">t</text><text x="295" y="-18" class="axis">a</text><text x="375" y="-18" class="axis">y</text>
    <text x="-42" y="52" class="axis">#</text><text x="-42" y="132" class="axis">p</text><text x="-42" y="212" class="axis">l</text><text x="-42" y="292" class="axis">a</text><text x="-42" y="372" class="axis">y</text>
    <g>
      <rect x="0" y="0" width="80" height="80" class="cell"/><rect x="80" y="0" width="80" height="80" class="cell"/><rect x="160" y="0" width="80" height="80" class="cell"/><rect x="240" y="0" width="80" height="80" class="cell"/><rect x="320" y="0" width="80" height="80" class="cell"/>
      <rect x="0" y="80" width="80" height="80" class="cell"/><rect x="80" y="80" width="80" height="80" class="cell"/><rect x="160" y="80" width="80" height="80" class="cell"/><rect x="240" y="80" width="80" height="80" class="cell"/><rect x="320" y="80" width="80" height="80" class="cell"/>
      <rect x="0" y="160" width="80" height="80" class="cell"/><rect x="80" y="160" width="80" height="80" class="cell"/><rect x="160" y="160" width="80" height="80" class="cell"/><rect x="240" y="160" width="80" height="80" class="cell"/><rect x="320" y="160" width="80" height="80" class="cell"/>
      <rect x="0" y="240" width="80" height="80" class="cell"/><rect x="80" y="240" width="80" height="80" class="cell"/><rect x="160" y="240" width="80" height="80" class="cell"/><rect x="240" y="240" width="80" height="80" class="cell"/><rect x="320" y="240" width="80" height="80" class="cell"/>
      <rect x="0" y="320" width="80" height="80" class="cell"/><rect x="80" y="320" width="80" height="80" class="cell"/><rect x="160" y="320" width="80" height="80" class="cell"/><rect x="240" y="320" width="80" height="80" class="cell"/><rect x="320" y="320" width="80" height="80" fill="#f3d9b8" stroke="#bc7136" stroke-width="3"/>
    </g>
    <g text-anchor="middle" dominant-baseline="middle" class="text">
      <text x="40" y="40">0</text><text x="120" y="40">1</text><text x="200" y="40">2</text><text x="280" y="40">3</text><text x="360" y="40">4</text>
      <text x="40" y="120">1</text><text x="120" y="120">2</text><text x="200" y="120">3</text><text x="280" y="120">4</text><text x="360" y="120">5</text>
      <text x="40" y="200">2</text><text x="120" y="200">3</text><text x="200" y="200">4</text><text x="280" y="200">5</text><text x="360" y="200">6</text>
      <text x="40" y="280">3</text><text x="120" y="280">4</text><text x="200" y="280">5</text><text x="280" y="280">4</text><text x="360" y="280">5</text>
      <text x="40" y="360">4</text><text x="120" y="360">5</text><text x="200" y="360">6</text><text x="280" y="360">5</text><text x="360" y="360">4</text>
    </g>
  </g>
  <text x="500" y="505" class="note">右下角 D[4,4] = 4：play -> stay 至少需要 4 的代价</text>
  <text x="500" y="535" class="note">相同字符：替换代价为 0；不同字符：替换代价为 rep_cost</text>
</svg>
