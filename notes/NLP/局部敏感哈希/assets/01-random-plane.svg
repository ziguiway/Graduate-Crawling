<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
  <rect width="760" height="470" fill="#fffdf8"/>
  <text x="38" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">One random plane gives one bit</text>
  <line x1="80" y1="380" x2="700" y2="380" stroke="#495057" stroke-width="2"/>
  <line x1="390" y1="420" x2="390" y2="72" stroke="#495057" stroke-width="2"/>
  <text x="682" y="405" font-family="Arial, sans-serif" font-size="18" fill="#495057">x</text>
  <text x="402" y="91" font-family="Arial, sans-serif" font-size="18" fill="#495057">y</text>
  <line x1="115" y1="105" x2="665" y2="405" stroke="#d94841" stroke-width="4"/>
  <text x="535" y="155" font-family="Arial, sans-serif" font-size="18" fill="#b02a37">P · v = 0</text>
  <text x="505" y="205" font-family="Arial, sans-serif" font-size="19" fill="#16794f">P · v &gt; 0  -&gt;  bit 1</text>
  <text x="115" y="300" font-family="Arial, sans-serif" font-size="19" fill="#9c2c2c">P · v &lt; 0  -&gt;  bit 0</text>
  <line x1="390" y1="380" x2="505" y2="137" stroke="#1261a0" stroke-width="4"/>
  <polygon points="505,137 494,157 484,148" fill="#1261a0"/>
  <text x="515" y="130" font-family="Arial, sans-serif" font-size="20" fill="#1261a0">P = [1, 1]</text>
  <line x1="390" y1="380" x2="535" y2="280" stroke="#16794f" stroke-width="4"/>
  <polygon points="535,280 513,283 522,296" fill="#16794f"/>
  <text x="545" y="278" font-family="Arial, sans-serif" font-size="19" fill="#16794f">v1 = [1, 2]</text>
  <text x="545" y="305" font-family="Arial, sans-serif" font-size="18" fill="#16794f">dot = 3 -&gt; 1</text>
  <line x1="390" y1="380" x2="245" y2="280" stroke="#9c2c2c" stroke-width="4"/>
  <polygon points="245,280 258,296 267,283" fill="#9c2c2c"/>
  <text x="105" y="250" font-family="Arial, sans-serif" font-size="19" fill="#9c2c2c">v2 = [-2, -1]</text>
  <text x="105" y="277" font-family="Arial, sans-serif" font-size="18" fill="#9c2c2c">dot = -3 -&gt; 0</text>
  <text x="82" y="445" font-family="Arial, sans-serif" font-size="17" fill="#495057">The red line is the boundary; P is perpendicular to it.</text>
</svg>
