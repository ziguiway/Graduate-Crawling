<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470">
  <rect width="840" height="470" fill="#fffdf8"/>
  <text x="35" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">多个随机平面生成桶编号</text>
  <line x1="65" y1="375" x2="350" y2="95" stroke="#d94841" stroke-width="3"/>
  <line x1="70" y1="120" x2="355" y2="390" stroke="#1261a0" stroke-width="3"/>
  <line x1="90" y1="260" x2="365" y2="260" stroke="#16794f" stroke-width="3"/>
  <circle cx="235" cy="185" r="8" fill="#f08c46"/>
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="18" fill="#17202a">查询向量 q</text>
  <text x="78" y="418" font-family="Arial, sans-serif" font-size="17" fill="#495057">每个平面都判断 q 位于哪一侧</text>
  <line x1="440" y1="92" x2="440" y2="394" stroke="#adb5bd" stroke-width="2"/>
  <text x="485" y="112" font-family="Arial, sans-serif" font-size="20" fill="#17202a">各平面的判断结果</text>
  <text x="485" y="160" font-family="Arial, sans-serif" font-size="20" fill="#d94841">平面 1 → 1</text>
  <text x="485" y="205" font-family="Arial, sans-serif" font-size="20" fill="#1261a0">平面 2 → 0</text>
  <text x="485" y="250" font-family="Arial, sans-serif" font-size="20" fill="#16794f">平面 3 → 1</text>
  <line x1="480" y1="280" x2="760" y2="280" stroke="#495057" stroke-width="2"/>
  <text x="485" y="325" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17202a">二进制编码：101</text>
  <text x="485" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17202a">桶编号：1 + 0 + 4 = 5</text>
  <text x="485" y="415" font-family="Arial, sans-serif" font-size="18" fill="#495057">q 被放入 5 号桶</text>
</svg>
