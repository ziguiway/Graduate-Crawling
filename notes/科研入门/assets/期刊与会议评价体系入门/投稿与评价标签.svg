<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <rect width="1100" height="520" fill="#fbfaf7"/>
  <text x="550" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20252b">Submission is not submission to SCI</text>
  <rect x="55" y="190" width="190" height="100" rx="10" fill="#2d596b"/>
  <text x="150" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">Your paper</text>
  <text x="150" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e6f1f5">论文</text>
  <path d="M245 240 H330" stroke="#4e5961" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="335" y="135" width="250" height="210" rx="10" fill="#f1e4d1" stroke="#b9976c" stroke-width="3"/>
  <text x="460" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#634622">Choose a venue</text>
  <text x="460" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#634622">Journal or conference</text>
  <text x="460" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#765e45">选择具体期刊/会议</text>
  <text x="460" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#765e45">审稿与接收发生在这里</text>
  <path d="M585 240 H670" stroke="#4e5961" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="675" y="115" width="370" height="250" rx="10" fill="#e8f0f5" stroke="#7895a8" stroke-width="3"/>
  <text x="860" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#23465a">Venue labels</text>
  <text x="720" y="210" font-family="Arial, sans-serif" font-size="19" fill="#23465a">SCI/SCIE: indexed</text>
  <text x="720" y="250" font-family="Arial, sans-serif" font-size="19" fill="#23465a">JCR: Q1-Q4</text>
  <text x="720" y="290" font-family="Arial, sans-serif" font-size="19" fill="#23465a">CAS: Zone 1-4</text>
  <text x="720" y="330" font-family="Arial, sans-serif" font-size="19" fill="#23465a">CCF: A/B/C</text>
  <text x="550" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#9a4d36">You choose the venue; organizations assign the labels.</text>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#4e5961"/></marker></defs>
</svg>
