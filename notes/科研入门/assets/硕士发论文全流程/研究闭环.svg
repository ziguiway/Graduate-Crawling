  <g fill="none" stroke="#59636a" stroke-width="4" marker-end="url(#arrow)"><path d="M605 130 Q700 150 745 220"/><path d="M790 292 Q790 360 740 430"/><path d="M610 470 Q470 540 390 470"/><path d="M180 455 Q100 370 155 292"/><path d="M320 235 Q385 150 395 130"/></g>
