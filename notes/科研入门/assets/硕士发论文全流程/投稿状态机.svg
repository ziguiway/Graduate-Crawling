<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560">
  <rect width="1050" height="560" fill="#fbfaf7"/>
  <text x="525" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20252b">Submission is a branching process</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="400" y="100" width="250" height="70" rx="12" fill="#e4e1ef" stroke="#7e76a5" stroke-width="3"/><text x="525" y="130" font-size="21" font-weight="700" fill="#47416e">Submit</text><text x="525" y="155" font-size="16" fill="#47416e">投稿</text>
    <rect x="390" y="250" width="270" height="70" rx="12" fill="#f0ead5" stroke="#b39b54" stroke-width="3"/><text x="525" y="280" font-size="21" font-weight="700" fill="#665525">Review</text><text x="525" y="305" font-size="16" fill="#665525">审稿</text>
    <rect x="90" y="420" width="230" height="70" rx="12" fill="#f5e1e1" stroke="#b86c6c" stroke-width="3"/><text x="205" y="450" font-size="20" font-weight="700" fill="#713c3c">Reject</text><text x="205" y="475" font-size="16" fill="#713c3c">拒稿 → 修改/改投</text>
    <rect x="410" y="420" width="230" height="70" rx="12" fill="#e8f0f5" stroke="#7895a8" stroke-width="3"/><text x="525" y="450" font-size="20" font-weight="700" fill="#23465a">Rebuttal</text><text x="525" y="475" font-size="16" fill="#23465a">回复审稿意见</text>
    <rect x="730" y="420" width="230" height="70" rx="12" fill="#e7efd9" stroke="#839b67" stroke-width="3"/><text x="845" y="450" font-size="20" font-weight="700" fill="#40572d">Accept</text><text x="845" y="475" font-size="16" fill="#40572d">录用 → 终稿</text>
  </g>
  <g fill="none" stroke="#59636a" stroke-width="4" marker-end="url(#arrow)"><path d="M525 170 V250"/><path d="M460 320 Q350 365 240 420"/><path d="M525 320 V420"/><path d="M590 320 Q700 365 820 420"/></g>
  <text x="310" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#713c3c">意见集中在创新/实验问题</text>
  <text x="525" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#23465a">会议允许回复时</text>
  <text x="735" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#40572d">直接进入终稿流程</text>
  <text x="525" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a4d36">Rejection is a research feedback signal, not the end of the project.</text>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#59636a"/></marker></defs>
</svg>
